<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="styles.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basketball Scoreboard</title>
</head>
<body>
    <main>
        <div class="score-container">
            <div class="teams">
                      <div class="home-container">
                <h2>Home</h2>
                <div id="homePoints-container">0</div>
                <div class="home-btn-group">
                    <button onclick="add1Home()">+1</button>
                    <button onclick="add2Home()">+2</button>
                    <button onclick="add3Home()">+3</button>
                </div>
            </div>

            <div class="guest-container">
                <h2>Guest</h2>
                <div id="guestPoints-container">0</div>
                <div class="guest-btn-group">
                    <button onclick="add1Guest()">+1</button>
                    <button onclick="add2Guest()">+2</button>
                    <button onclick="add3Guest()">+3</button>
                </div>
                
            </div>
      
            </div>
            <div class="general-btn-group"></div>
            <button onclick="newGame()">New Game</button>
            
        </div>
        
    </main>
    

    <script src="main.js"></script>
    
</body>
</html>
